name: release

# Cutting a release used to mean building the tarballs by hand and remembering what to exclude.
# CPack already knows both answers, so the tag is what triggers them: push v5.0.1 and the source
# archive and the per-platform component archives are built, checked and attached.
on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archives:
    name: archives-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SHARED, deliberately. A static release build produces no runtime artefact, so the
      # qev_Runtime component packages to an empty 29-byte tarball -- which is what the first run
      # of this workflow attached to the release page. A shared build makes both components mean
      # something: the versioned object and its SONAME on one side, headers, link symlink, CMake
      # package and pkg-config on the other. Anyone wanting the static archive builds it from the
      # source tarball, which is also attached and is verified to build on its own.
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build build --config Release
      - name: Package
        working-directory: build
        env:
          COPYFILE_DISABLE: '1'
        run: cpack -G TGZ -C Release
      # Opening an archive and finding a notice is not proof of a runtime package. Require the
      # platform loader artefacts: full version + SONAME on ELF, full version + install-name
      # symlink on Darwin, and qev.dll on Windows. The checker's fixtures reject notices-only
      # archives and a Unix archive missing its loader name before inspecting the real output.
      - name: Verify component archive contracts
        shell: bash
        working-directory: build
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' ../CMakeLists.txt)
          system=$(sed -nE 's/^set\(CPACK_SYSTEM_NAME "([^"]+)"\)$/\1/p' CPackConfig.cmake)
          [ -n "$version" ] && [ -n "$system" ] \
            || { echo "::error::cannot derive qev version or CPack system name"; exit 1; }
          case "${RUNNER_OS:?}" in
            Windows) python_cmd=python ;;
            Linux|macOS) python_cmd=python3 ;;
            *) echo "::error::unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          command -v "$python_cmd" >/dev/null \
            || { echo "::error::$python_cmd is unavailable on $RUNNER_OS"; exit 1; }
          "$python_cmd" -c 'import sys, tarfile; assert sys.version_info >= (3, 10); print(sys.executable, sys.version)'
          # CPack/libarchive on macOS can encode inherited com.apple.provenance as
          # ._* sidecars even after xattr -cr and COPYFILE_DISABLE=1. Rewrite only
          # those sidecars, preserving every other tar member and loader alias.
          if [ "$RUNNER_OS" = macOS ]; then
            "$python_cmd" ../scripts/normalize-release-archives.py --self-test
            "$python_cmd" ../scripts/normalize-release-archives.py --directory . --system "$system" --version "$version"
          fi
          "$python_cmd" ../scripts/check-release-archives.py --self-test
          "$python_cmd" ../scripts/check-release-archives.py --directory . --system "$system" --version "$version"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qev-${{ matrix.os }}
          path: build/*.tar.gz
          if-no-files-found: error

  source:
    name: source archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Package source
        working-directory: build
        run: cpack --config CPackSourceConfig.cmake -G TGZ
      # The source release must build on its own. A tarball that needs the git tree is not a
      # source release, and this is the only place that difference shows.
      - name: The source archive must build standalone
        shell: bash
        working-directory: build
        run: |
          set -e
          tar xzf qev-*-Source.tar.gz
          d=$(ls -d qev-*-Source | head -1)
          cmake -S "$d" -B /tmp/srcbuild -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/srcbuild -j2
          ctest --test-dir /tmp/srcbuild --output-on-failure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qev-source
          path: build/qev-*-Source.tar.gz
          if-no-files-found: error

  publish:
    name: attach to the release
    needs: [ archives, source ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # the one job that writes, and only to attach assets to its own tag
      id-token: write       # the OIDC token the provenance statement is signed with
      attestations: write   # record that statement against the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist

      # Anyone can verify a download without installing anything. `gh attestation verify` below
      # is stronger, but it needs the gh CLI and a network call; sha256sum needs neither.
      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          set -e
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      # The release body comes from CHANGELOG.md, rendered by a script that can be run -- and
      # was run -- locally. Its failure modes are the ones a release actually has: a tag whose
      # version has no section, and a section that is a heading somebody forgot to fill in.
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          set -e
          python3 scripts/release-notes.py "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          echo "::notice::release notes: $(wc -c < RELEASE_NOTES.md) bytes"
          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      # Signed provenance: what built these archives, from which commit, with which workflow.
      # Verifiable with `gh attestation verify <file> --repo isndev/qev`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          make_latest: true
