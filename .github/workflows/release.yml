name: release

# Cutting a release used to mean building the tarballs by hand and remembering what to exclude.
# CPack already knows both answers, so the tag is what triggers them: push v5.0.1 and the source
# archive and the per-platform component archives are built, checked and attached.
on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archives:
    name: archives-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHARED, deliberately. A static release build produces no runtime artefact, so the
      # qev_Runtime component packages to an empty 29-byte tarball -- which is what the first run
      # of this workflow attached to the release page. A shared build makes both components mean
      # something: the versioned object and its SONAME on one side, headers, link symlink, CMake
      # package and pkg-config on the other. Anyone wanting the static archive builds it from the
      # source tarball, which is also attached and is verified to build on its own.
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build build --config Release
      - name: Package
        working-directory: build
        run: cpack -G TGZ -C Release
      # A release archive nobody opened is a release archive that might be empty. Unpack it and
      # require the header and the library to be inside before it is allowed near a release page.
      # A release archive nobody opened is a release archive that might be empty. Unpack the
      # listing and require the header to be inside before it goes near a release page.
      #
      # No pipe into `head` or `grep -q` here, and that is not style. GitHub runs `shell: bash` as
      # `bash -eo pipefail`, and both of those close the pipe as soon as they have what they want,
      # which kills `tar` with SIGPIPE -- so the pipeline fails on a PERFECTLY GOOD archive. That is
      # exactly what happened on the first run of this job: the listing printed include/qev/ev.h and
      # the step still reported it missing. The listing goes to a file, and the file is searched.
      - name: Verify the archives are not empty
        shell: bash
        working-directory: build
        run: |
          set -e
          found=0
          for a in *.tar.gz; do
            [ -e "$a" ] || continue
            found=$((found+1))
            echo "-- $a"
            tar tzf "$a" > "$a.list"
            sed -n '1,20p' "$a.list" | sed 's/^/     /'
          done
          [ "$found" -ge 1 ] || { echo "::error::cpack produced no archive"; exit 1; }
          dev=$(ls *Development*.tar.gz.list 2>/dev/null | head -1) || true
          [ -n "$dev" ] || { echo "::error::no development archive was produced"; exit 1; }
          grep -q 'include/qev/ev\.h' "$dev" \
            || { echo "::error::the development archive carries no ev.h"; exit 1; }
          # No archive may be trivially empty. An empty tarball is ~29 bytes and looks like a
          # successful package right up until somebody downloads it; requiring an entry per
          # archive is what turns that into a failed build instead of a bad release page.
          for l in *.tar.gz.list; do
            n=$(grep -c . "$l" || true)
            echo "   ${l%.list}: $n entr(y|ies)"
            [ "$n" -ge 1 ] || { echo "::error::${l%.list} is empty"; exit 1; }
          done
          rm -f ./*.list

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qev-${{ matrix.os }}
          path: build/*.tar.gz
          if-no-files-found: error

  source:
    name: source archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Package source
        working-directory: build
        run: cpack --config CPackSourceConfig.cmake -G TGZ
      # The source release must build on its own. A tarball that needs the git tree is not a
      # source release, and this is the only place that difference shows.
      - name: The source archive must build standalone
        shell: bash
        working-directory: build
        run: |
          set -e
          tar xzf qev-*-Source.tar.gz
          d=$(ls -d qev-*-Source | head -1)
          cmake -S "$d" -B /tmp/srcbuild -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/srcbuild -j2
          ctest --test-dir /tmp/srcbuild --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qev-source
          path: build/qev-*-Source.tar.gz
          if-no-files-found: error

  publish:
    name: attach to the release
    needs: [ archives, source ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the one job that writes, and only to attach assets to its own tag
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
